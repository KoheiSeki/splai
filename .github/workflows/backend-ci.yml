name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # CI 内で ephemeral Postgres を起動。tests/conftest.py が
    # DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/splai_test を
    # env から読み取って利用する。Supabase に接続する必要はない。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Postgres service container への接続。asyncpg driver を指定。
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/splai_test
      APP_ENV: test
      ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Apply alembic migrations
        # CI の Postgres は空なので、test 実行前に schema を構築する必要がある。
        # alembic 自体の壊れもこのステップで検知できる(migration が
        # 走らなければ即 fail)。
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -v
