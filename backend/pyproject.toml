[project]
name = "splai-backend"
version = "0.1.0"
description = "SPLAI backend - FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.16",
    "httpx>=0.27",
    "openai>=2.41.0",
    "sse-starlette>=3.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "httpx>=0.27",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[project.scripts]
dump-openapi = "scripts.dump_openapi:main"
